        <div class="movieModal" id="showForm">
            <form id="movieForm">
                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <h3>Add Movie</h3>
                        <i class="fa-solid fa-xmark fa-2x" id="closeMark" role="button"></i>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="movieName">Movie Name</label>
                            <input type="text" class="form-control" id="movieName">
                        </div>
                        <div class="form-group">
                            <label for="movieImg">Movie Image</label>
                            <input type="text" class="form-control" id="movieImg">
                        </div>
                        <div class="form-group">
                            <label for="movieDesciption">Movie Desciption</label>
                            <textarea type="text" row="4" class="form-control" id="movieDesciption"></textarea>
                        </div>
                          <div class="form-group">
                            <label for="rating">Rating</label>
                            <input type="text" class="form-control" id="movieRating">
                        </div>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <button type="submit" class="editBtn" id="addMovie">Add Movie</button>
                        <button type="button" class="editBtn d-none" id="updateMovie" >Update Movie</button>
                        <button type="button" class="primaryBtn" id="closeForm">close</button>
                    </div>
                </div>
            </form>
